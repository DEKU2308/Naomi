<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Naomi 💗</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #fff0f6);
  overflow: hidden;
  text-align: center;
}

.card {
  background: white;
  width: 85%;
  max-width: 380px;
  padding: 35px 20px;
  border-radius: 30px;
  box-shadow: 0 15px 40px rgba(0,0,0,.12);
}

h1 {
  color: #ff4f91;
  font-size: 30px;
}

p {
  color: #555;
  font-size: 18px;
}

button {
  border: none;
  border-radius: 18px;
  padding: 15px 25px;
  font-size: 17px;
  margin: 10px;
  font-weight: bold;
}

#yes {
  background: #ff6fa5;
  color: white;
}

#no {
  background: #eee;
  color: #555;
  position: relative;
}

#message {
  display: none;
  font-size: 24px;
  color: #ff4f91;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

  <div id="question">
    <h1>Hey Naomi 💗</h1>

    <p>
      I have a very important question...
    </p>

    <h2>Will you go out with me? 🥹💕</h2>

    <button id="yes">YES 💕</button>
    <button id="no">NO 😭</button>
  </div>

  <div id="message">
    YAYYYYY 😭💗<br><br>
    I knew you'd say yes, Naomi 🥹💕<br><br>
    Now you owe me a date 😌❤️
  </div>

</div>

<script>

const no = document.getElementById("no");
const yes = document.getElementById("yes");

no.addEventListener("mouseover", moveNo);
no.addEventListener("touchstart", moveNo);

function moveNo() {
  const x = Math.random() * 220 - 110;
  const y = Math.random() * 180 - 90;

  no.style.transform =
    `translate(${x}px, ${y}px)`;
}

yes.addEventListener("click", function() {
  document.getElementById("question").style.display = "none";
  document.getElementById("message").style.display = "block";
});

</script>

</body>
</html>
